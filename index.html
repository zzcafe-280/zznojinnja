<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>初詣 ずずノ神社）</title>
  <style>
    :root{ --bg:#fffaf2; --accent:#b22222; --paper:#fffefb; --text:#2b2b2b; }
    *{box-sizing:border-box}
    html,body,#app{height:100%; margin:0; font-family:"Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,-apple-system,"Segoe UI",Roboto,Arial;}
    body{background:radial-gradient(circle at 10% 10%, rgba(255,230,230,0.5), transparent 10%), linear-gradient(180deg,#fffdf7 0%,#fff7f0 100%); color:var(--text); padding-bottom:120px;}
    .header{ text-align:center; padding:20px 10px 0 10px; background-image:linear-gradient(90deg, rgba(178,34,34,0.07), rgba(255,160,122,0.03)); border-bottom:1px solid #ffe7e0; }
    .header h1{margin:0; color:var(--accent); font-size:1.8rem;}
    .subtitle{margin:6px 0 12px 0; color:#6b6b6b}
    .screen{display:none; padding:18px; max-width:1100px; margin:0 auto;}
    .screen.active{display:block}
    .buttons{display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-top:30px}
    .big{background:var(--accent); color:white; border:none; padding:18px 28px; font-size:1.2rem; border-radius:10px; cursor:pointer; box-shadow:0 6px 0 rgba(0,0,0,0.06)}
    .topbar{display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:10px; padding:6px 10px}
    .tool-controls{display:flex; gap:8px; align-items:center}
    .tool{padding:8px 10px; border-radius:8px; border:1px solid #ddd; background:white; cursor:pointer}
    .tool.active{border-color:var(--accent)}
    .canvas-wrap{display:flex; justify-content:center; padding:8px; position:relative}
    /* canvases are absolutely positioned and sized by JS to avoid CSS timing issues */
    canvas.ema-bg { position:absolute; left:0; top:0; z-index:1; display:block; border-radius:8px; box-shadow:0 6px 24px rgba(0,0,0,0.08); background:var(--paper); touch-action:none; }
    canvas.ema-strokes { position:absolute; left:0; top:0; z-index:2; display:block; border-radius:8px; box-shadow:0 6px 24px rgba(0,0,0,0.08); touch-action:none; }
    .palette{display:flex; gap:6px; align-items:center; padding-left:8px}
    .swatch{width:28px; height:28px; border-radius:6px; border:2px solid rgba(255,255,255,0.6); box-shadow:0 1px 0 rgba(0,0,0,0.06); cursor:pointer}
    .swatch.selected{outline:3px solid rgba(0,0,0,0.12)}
    .size-indicator{font-size:13px; color:#444; margin-left:8px}
    .actions{display:flex; justify-content:center; gap:12px; margin-top:12px}
    .primary{background:var(--accent); color:white; border:none; padding:10px 16px; border-radius:8px; cursor:pointer}
    .secondary{background:#fff; border:1px solid #ddd; padding:10px 16px; border-radius:8px; cursor:pointer}
    .gallery-row{display:flex; gap:12px; overflow-x:auto; padding:12px 8px; align-items:flex-start}
    .gallery-item{min-width:240px; border-radius:8px; background:white; padding:6px; box-shadow:0 4px 10px rgba(0,0,0,0.06)}
    .gallery-item canvas{display:block; width:100%; height:auto; border-radius:6px}
    .meta{display:flex; justify-content:space-between; align-items:center; margin-top:6px}
    .footer{position:fixed; left:18px; bottom:8px; color:#7a7a7a}
    .admin-open-btn{ position:fixed; left:18px; bottom:18px; background:rgba(0,0,0,0.06); border-radius:8px; padding:8px 10px; cursor:pointer; font-size:12px; border:1px solid rgba(0,0,0,0.06) }
    .admin-badge{position:fixed; right:18px; bottom:18px; background:var(--accent); color:white; padding:6px 8px; border-radius:8px; font-size:12px; display:none}
    .admin-badge.visible{display:block}
    .admin-modal{ position:fixed; left:0; top:0; right:0; bottom:0; display:flex; align-items:center; justify-content:center; background:rgba(0,0,0,0.35); }
    .admin-box{background:white; padding:18px; border-radius:10px; width:320px; box-shadow:0 10px 30px rgba(0,0,0,0.2)}
    @media(max-width:880px){ .gallery-item{min-width:160px} }
  </style>
</head>
<body>
  <div id="app">
    <header class="header">
      <h1>初詣 ずずノ神社</h1>
      <p class="subtitle"></p>
    </header>

    <main>
      <section id="home" class="screen active">
        <div class="buttons">
          <button id="btn-draw" class="big">絵馬を描く</button>
          <button id="btn-gallery" class="big">絵馬を見る</button>
        </div>
      </section>

      <section id="draw" class="screen">
        <div class="topbar">
          <label style="flex:1">注意文 <input id="notice-input" type="text" placeholder="見られても良いものを描いてください" style="width:100%;padding:6px;margin-left:8px"/></label>
          <div class="tool-controls">
            <button id="tool-pen" class="tool active">ペン</button>
            <button id="tool-eraser" class="tool">消しゴム</button>
            <label style="display:flex;align-items:center;gap:6px">太さ <input id="size-range" type="range" min="1" max="80" value="6" /></label>
          </div>
        </div>

        <div class="canvas-wrap" id="canvas-wrap" style="max-width:820px; margin:0 auto; height:520px;">
          <canvas id="bg-canvas" class="ema-bg"></canvas>
          <canvas id="strokes-canvas" class="ema-strokes"></canvas>
        </div>

        <div style="display:flex; justify-content:center; gap:14px; margin-top:10px; align-items:center;">
          <div class="palette" id="palette"></div>
          <div class="size-indicator">サイズ: <span id="size-val">6</span> px</div>
        </div>

        <div class="actions">
          <button id="save-ema" class="primary">保存（Firestore）</button>
          <button id="back-from-draw" class="secondary">ホームへ</button>
        </div>
      </section>

      <section id="gallery" class="screen">
        <h2>みんなの絵馬</h2>
        <div id="gallery-row" class="gallery-row"></div>
        <div class="actions"><button id="back-from-gallery" class="secondary">ホームへ</button></div>
      </section>

    </main>

    <footer class="footer"><small>デバッグ表示あり</small></footer>
    <div id="admin-open-btn" class="admin-open-btn">管理</div>
    <div id="admin-badge" class="admin-badge">Admin</div>

    <div id="admin-modal" style="display:none" class="admin-modal" aria-hidden="true">
      <div class="admin-box">管理ダイアログ</div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
    import { getFirestore, collection, addDoc, query, orderBy, getDocs, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

    const CONFIG = {
      firebaseConfig: {
        apiKey: "AIzaSyDnkGy9oon2bHsp5dHDR0UozhSZdV0mDnw",
        authDomain: "zuzunojinnja.firebaseapp.com",
        projectId: "zuzunojinnja",
        storageBucket: "zuzunojinnja.appspot.com",
        messagingSenderId: "1064706171598",
        appId: "1:1064706171598:web:04b302be4b50daf551a69f",
      },
      emaBackgroundUrl: "https://raw.githubusercontent.com/zzcafe-280/zznojinnja/main/ema.png"
    };

    const app = initializeApp(CONFIG.firebaseConfig);
    const db = getFirestore(app);

    const qs = s => document.querySelector(s);
    const qsa = s => document.querySelectorAll(s);

    const btnDraw = qs('#btn-draw');
    const btnGallery = qs('#btn-gallery');
    const backFromDraw = qs('#back-from-draw');
    const backFromGallery = qs('#back-from-gallery');

    const noticeInput = qs('#notice-input');
    const toolPen = qs('#tool-pen');
    const toolEraser = qs('#tool-eraser');
    const sizeRange = qs('#size-range');
    const sizeVal = qs('#size-val');
    const saveBtn = qs('#save-ema');

    const bgCanvas = qs('#bg-canvas');
    const strokesCanvas = qs('#strokes-canvas');
    const canvasWrap = qs('#canvas-wrap');

    const galleryRow = qs('#gallery-row');

    // contexts
    const bgCtx = bgCanvas.getContext('2d');
    const sCtx = strokesCanvas.getContext('2d');

    // fixed logical canvas size (internal coordinate base)
    const LOGICAL_W = 1640;
    const LOGICAL_H = 1040;

    // palette
    const PALETTE = [
      {name:'桃色', color:'#ffb6c1'}, {name:'赤', color:'#ff3b30'},
      {name:'橙', color:'#ff9500'}, {name:'黄', color:'#ffd60a'},
      {name:'緑', color:'#34c759'}, {name:'青', color:'#0a84ff'},
      {name:'紫', color:'#af52de'}, {name:'茶', color:'#8b5a2b'},
      {name:'黒', color:'#000000'}
    ];
    let currentColor = '#000000';
    let penSize = parseInt(sizeRange.value,10) || 6;
    sizeVal.textContent = penSize;

    // build palette UI
    const paletteEl = qs('#palette');
    PALETTE.forEach(p=>{
      const sw = document.createElement('div');
      sw.className = 'swatch';
      sw.style.background = p.color;
      if (p.color === currentColor) sw.classList.add('selected');
      sw.addEventListener('click', ()=> {
        currentColor = p.color;
        qsa('.swatch').forEach(e=>e.classList.remove('selected'));
        sw.classList.add('selected');
        tool = 'pen';
        toolPen.classList.add('active'); toolEraser.classList.remove('active');
      });
      paletteEl.appendChild(sw);
    });

    // ensure canvasWrap has a stable height (avoid 0)
    function ensureCanvasWrapHeight(){
      // if canvasWrap has computed height 0, set an explicit pixel height (fallback)
      const rect = canvasWrap.getBoundingClientRect();
      if (rect.height === 0){
        canvasWrap.style.height = '520px';
      }
    }

    // resize canvases: set CSS size to display size and internal logical size fixed
    function resizeLayerCanvases(){
      // compute display size based on wrapper
      ensureCanvasWrapHeight();
      const wrapRect = canvasWrap.getBoundingClientRect();
      const displayW = Math.max(1, Math.round(wrapRect.width));
      const displayH = Math.max(1, Math.round(wrapRect.height));

      // set CSS size so canvas scales visually
      bgCanvas.style.width = displayW + 'px'; bgCanvas.style.height = displayH + 'px';
      strokesCanvas.style.width = displayW + 'px'; strokesCanvas.style.height = displayH + 'px';

      // internal drawing resolution: keep LOGICAL_W/H (so normalized coords remain same)
      // but set actual canvas.width/height to logical values (no DPR scaling here to keep mapping simple)
      // (alternative: multiply by devicePixelRatio and scale contexts, but then normalized mapping needs adjust)
      bgCanvas.width = LOGICAL_W; bgCanvas.height = LOGICAL_H;
      strokesCanvas.width = LOGICAL_W; strokesCanvas.height = LOGICAL_H;

      // reposition canvases absolutely inside wrapper
      bgCanvas.style.left = '0px'; bgCanvas.style.top = '0px';
      strokesCanvas.style.left = '0px'; strokesCanvas.style.top = '0px';

      // redraw after resize
      drawBackground();
      redrawStrokes();
    }

    // image load + background draw
    const emaImage = new Image();
    emaImage.crossOrigin = 'anonymous';
    emaImage.src = CONFIG.emaBackgroundUrl;
    emaImage.addEventListener('load', () => {
      // when image loads, ensure canvas sizes and draw
      // do a small timeout to let layout settle if needed
      requestAnimationFrame(()=> { resizeLayerCanvases(); });
    });

    function drawBackground(){
      // draw background image scaled to LOGICAL_W/H
      bgCtx.clearRect(0,0,LOGICAL_W,LOGICAL_H);
      if (emaImage && emaImage.complete){
        try {
          bgCtx.drawImage(emaImage, 0, 0, LOGICAL_W, LOGICAL_H);
        } catch(e){
          bgCtx.fillStyle = '#fff'; bgCtx.fillRect(0,0,LOGICAL_W,LOGICAL_H);
        }
      } else {
        bgCtx.fillStyle = '#fff'; bgCtx.fillRect(0,0,LOGICAL_W,LOGICAL_H);
      }
      // notice text
      const notice = noticeInput.value || '';
      if (notice){
        bgCtx.save();
        bgCtx.fillStyle = "rgba(0,0,0,0.92)";
        const fontSize = Math.floor(LOGICAL_W / 28);
        bgCtx.font = `bold ${fontSize}px "Noto Sans JP", sans-serif`;
        bgCtx.textAlign = "center";
        bgCtx.fillText(notice, LOGICAL_W/2, fontSize + 14);
        bgCtx.restore();
      }
    }

    // strokes & drawing
    let strokes = [];
    let drawing = false;
    let currentStroke = null;
    let tool = 'pen';

    function getPointerInLogical(e){
      const rect = strokesCanvas.getBoundingClientRect();
      // if height/width temporarily 0, ensure resize and recalc
      if (rect.width === 0 || rect.height === 0){
        // force resize to recover
        resizeLayerCanvases();
      }
      const clientX = (e.clientX !== undefined) ? e.clientX : (e.touches && e.touches[0].clientX);
      const clientY = (e.clientY !== undefined) ? e.clientY : (e.touches && e.touches[0].clientY);
      const xRatio = (clientX - rect.left) / rect.width;
      const yRatio = (clientY - rect.top) / rect.height;
      const x = Math.max(0, Math.min(1, xRatio));
      const y = Math.max(0, Math.min(1, yRatio));
      return { x, y, lx: x * LOGICAL_W, ly: y * LOGICAL_H };
    }

    function beginStroke(e){
      drawing = true;
      const p = getPointerInLogical(e);
      const widthNorm = penSize / LOGICAL_W;
      currentStroke = { type: tool === 'eraser' ? 'eraser' : 'pen', color: currentColor, widthNorm, points: [{x: p.x, y: p.y}] };
    }
    function moveStroke(e){
      if (!drawing || !currentStroke) return;
      const p = getPointerInLogical(e);
      currentStroke.points.push({ x: p.x, y: p.y });
      redrawStrokes(); // immediate feedback
    }
    function endStroke(e){
      if (!drawing) return;
      drawing = false;
      if (currentStroke && currentStroke.points.length > 0){
        strokes.push(currentStroke);
      }
      currentStroke = null;
      redrawStrokes();
    }

    strokesCanvas.addEventListener('pointerdown', (e)=> { strokesCanvas.setPointerCapture(e.pointerId); beginStroke(e); });
    strokesCanvas.addEventListener('pointermove', moveStroke);
    strokesCanvas.addEventListener('pointerup', (e)=> { strokesCanvas.releasePointerCapture(e.pointerId); endStroke(e); });
    strokesCanvas.addEventListener('pointerout', endStroke);
    strokesCanvas.addEventListener('pointercancel', endStroke);

    function redrawStrokes(){
      sCtx.clearRect(0,0,LOGICAL_W,LOGICAL_H);
      const all = strokes.concat(currentStroke ? [currentStroke] : []);
      for (const st of all){
        if (!st) continue;
        if (st.type === 'pen'){
          sCtx.globalCompositeOperation = 'source-over';
          sCtx.strokeStyle = st.color || '#000';
        } else {
          sCtx.globalCompositeOperation = 'destination-out';
          sCtx.strokeStyle = 'rgba(0,0,0,1)';
        }
        sCtx.lineWidth = (st.widthNorm || 0.004) * LOGICAL_W;
        sCtx.lineJoin = 'round';
        sCtx.lineCap = 'round';
        sCtx.beginPath();
        for (let i=0;i<st.points.length;i++){
          const p = st.points[i];
          const x = p.x * LOGICAL_W;
          const y = p.y * LOGICAL_H;
          if (i===0) sCtx.moveTo(x,y); else sCtx.lineTo(x,y);
        }
        sCtx.stroke();
      }
      sCtx.globalCompositeOperation = 'source-over';
    }

    // UI bindings
    sizeRange.addEventListener('input', (e)=> { penSize = parseInt(e.target.value,10); sizeVal.textContent = penSize; } );
    toolPen.addEventListener('click', ()=> { tool = 'pen'; toolPen.classList.add('active'); toolEraser.classList.remove('active'); } );
    toolEraser.addEventListener('click', ()=> { tool = 'eraser'; toolEraser.classList.add('active'); toolPen.classList.remove('active'); } );

    // Save to Firestore (vector strokes)
    saveBtn.addEventListener('click', async ()=>{
      try {
        saveBtn.disabled = true; saveBtn.textContent = '保存中...';
        const round = v => Math.round(v*10000)/10000;
        const compressPoints = pts => pts.map(p => ({ x: round(p.x), y: round(p.y) }));
        const payload = {
          strokes: strokes.map(s => ({ type: s.type, color: s.color, widthNorm: Math.round((s.widthNorm||0.004)*100000)/100000, points: compressPoints(s.points) })),
          notice: (noticeInput.value||'').slice(0,200),
          createdAt: serverTimestamp()
        };
        await addDoc(collection(db, 'emas'), payload);
        alert('保存しました');
        strokes = []; redrawStrokes();
      } catch (err) {
        console.error(err);
        alert('保存に失敗しました。Firestore の権限を確認してください。');
      } finally {
        saveBtn.disabled = false; saveBtn.textContent = '保存（Firestore）';
      }
    });

    // Gallery rendering (replay strokes with same normalized coords)
    async function fetchGalleryOnce(){
      try {
        const q = query(collection(db, 'emas'), orderBy('createdAt','desc'));
        const snap = await getDocs(q);
        const items = [];
        snap.forEach(d => items.push({ id: d.id, ...d.data() }));
        renderGallery(items);
      } catch (err){
        console.error(err);
        alert('ギャラリー取得エラー。Firestore ルールを確認してください。');
      }
    }

    function renderGallery(items){
      galleryRow.innerHTML = '';
      items.forEach(item=>{
        const wrap = document.createElement('div'); wrap.className = 'gallery-item';
        const TH_W = 820;
        const TH_H = Math.round((LOGICAL_H / LOGICAL_W) * TH_W);
        const thumb = document.createElement('canvas'); thumb.width = TH_W; thumb.height = TH_H;
        const tctx = thumb.getContext('2d');
        if (emaImage.complete) { try { tctx.drawImage(emaImage, 0,0, TH_W, TH_H); } catch(e){ tctx.fillStyle='#fff'; tctx.fillRect(0,0,TH_W,TH_H); } }
        else { tctx.fillStyle='#fff'; tctx.fillRect(0,0,TH_W,TH_H); }
        if (item.notice){ tctx.save(); tctx.fillStyle='rgba(0,0,0,0.92)'; const fs=Math.floor(TH_W/28); tctx.font=`bold ${fs}px sans-serif`; tctx.textAlign='center'; tctx.fillText(item.notice, TH_W/2, fs+12); tctx.restore(); }
        if (item.strokes && Array.isArray(item.strokes)){
          for (const st of item.strokes){
            if (st.type === 'pen') tctx.globalCompositeOperation = 'source-over'; else tctx.globalCompositeOperation = 'destination-out';
            tctx.strokeStyle = st.color || '#000';
            tctx.lineWidth = (st.widthNorm||0.004) * TH_W;
            tctx.lineCap = 'round'; tctx.lineJoin = 'round'; tctx.beginPath();
            for (let i=0;i<st.points.length;i++){ const p=st.points[i]; const x=p.x*TH_W; const y=p.y*TH_H; if (i===0) tctx.moveTo(x,y); else tctx.lineTo(x,y); }
            tctx.stroke();
          }
          tctx.globalCompositeOperation='source-over';
        }
        wrap.appendChild(thumb);
        const meta = document.createElement('div'); meta.className='meta'; const time=document.createElement('small');
        if (item.createdAt && item.createdAt.seconds) time.textContent = new Date(item.createdAt.seconds*1000).toLocaleString();
        meta.appendChild(time); wrap.appendChild(meta); galleryRow.appendChild(wrap);
      });
    }

    // Screen / navigation helpers:
    function showScreen(id){
      qsa('.screen').forEach(s=>s.classList.remove('active'));
      qs('#'+id).classList.add('active');
      // when showing draw screen, ensure canvases resized after layout
      if (id === 'draw'){
        requestAnimationFrame(()=> { resizeLayerCanvases(); });
      }
    }
    btnDraw.addEventListener('click', ()=> { showScreen('draw'); });
    btnGallery.addEventListener('click', ()=> { showScreen('gallery'); fetchGalleryOnce(); });
    backFromDraw.addEventListener('click', ()=> showScreen('home'));
    backFromGallery.addEventListener('click', ()=> showScreen('home'));

    // window resize: recalc
    window.addEventListener('resize', ()=> { requestAnimationFrame(()=> resizeLayerCanvases()); });

    // initial
    function init(){
      // ensure wrapper has explicit height to avoid 0px race
      if (!canvasWrap.style.height) canvasWrap.style.height = '520px';
      resizeLayerCanvases();
      drawBackground();
      redrawStrokes();
    }
    init();

    // expose debug helpers
    window._EMA_APP = { resizeLayerCanvases, drawBackground, redrawStrokes, strokes };

  </script>
</body>
</html>
