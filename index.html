<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>初詣 ずずノ神社</title>
  <style>
    :root{
      --bg:#fffaf2;
      --accent:#b22222;
      --paper:#fffefb;
      --text:#2b2b2b;
    }
    *{box-sizing:border-box}
    html,body,#app{height:100%; margin:0; font-family: "Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;}
    body{background:
      radial-gradient(circle at 10% 10%, rgba(255, 230, 230,0.5), transparent 10%),
      linear-gradient(180deg, #fffdf7 0%, #fff7f0 100%);
      color:var(--text);
      padding-bottom:120px;
    }
    .header{
      text-align:center;
      padding:20px 10px 0 10px;
      background-image: linear-gradient(90deg, rgba(178,34,34,0.07), rgba(255,160,122,0.03));
      border-bottom: 1px solid #ffe7e0;
    }
    .header h1{margin:0; color:var(--accent); font-size:1.8rem;}
    .subtitle{margin:6px 0 12px 0; color:#6b6b6b}
    .screen{display:none; padding:18px; max-width:1100px; margin:0 auto;}
    .screen.active{display:block}
    .buttons{display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-top:30px}
    .big{background:var(--accent); color:white; border:none; padding:18px 28px; font-size:1.2rem; border-radius:10px; cursor:pointer; box-shadow:0 6px 0 rgba(0,0,0,0.06)}
    .topbar{display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:10px; padding:6px 10px}
    .tool-controls{display:flex; gap:8px; align-items:center}
    .tool{padding:8px 10px; border-radius:8px; border:1px solid #ddd; background:white; cursor:pointer}
    .tool.active{border-color:var(--accent); box-shadow:0 2px 0 rgba(178,34,34,0.1)}
    .canvas-wrap{display:flex; justify-content:center; padding:8px; position:relative}
    /* two layered canvases: background + stroke layer */
    .ema-layer{position:absolute; left:0; top:0; width:100%; height:100%}
    #bg-canvas, #strokes-canvas { border-radius:8px; box-shadow:0 6px 24px rgba(0,0,0,0.08); background:var(--paper); touch-action:none }
    .actions{display:flex; justify-content:center; gap:12px; margin-top:12px}
    .primary{background:var(--accent); color:white; border:none; padding:10px 16px; border-radius:8px; cursor:pointer}
    .secondary{background:#fff; border:1px solid #ddd; padding:10px 16px; border-radius:8px; cursor:pointer}
    .gallery-row{display:flex; gap:12px; overflow-x:auto; padding:12px 8px; align-items:flex-start}
    .gallery-item{min-width:240px; border-radius:8px; background:white; padding:6px; box-shadow:0 4px 10px rgba(0,0,0,0.06)}
    .gallery-item canvas{display:block; width:100%; border-radius:6px}
    .meta{display:flex; justify-content:space-between; align-items:center; margin-top:6px}
    .omikuji-area{display:flex; justify-content:center; align-items:center; min-height:320px; gap:12px; flex-direction:column}
    .footer{position:fixed; left:18px; bottom:8px; color:#7a7a7a}
    .admin-open-btn{
      position:fixed; left:18px; bottom:18px; background:rgba(0,0,0,0.06); border-radius:8px; padding:8px 10px; cursor:pointer; font-size:12px; border:1px solid rgba(0,0,0,0.06)
    }
    .admin-badge{position:fixed; right:18px; bottom:18px; background:var(--accent); color:white; padding:6px 8px; border-radius:8px; font-size:12px; display:none}
    .admin-badge.visible{display:block}
    .admin-modal{
      position:fixed; left:0; top:0; right:0; bottom:0; display:flex; align-items:center; justify-content:center; background:rgba(0,0,0,0.35);
    }
    .admin-box{background:white; padding:18px; border-radius:10px; width:320px; box-shadow:0 10px 30px rgba(0,0,0,0.2)}
    .admin-box input{width:100%; padding:8px; margin-top:8px; margin-bottom:12px; box-sizing:border-box}
    @media(max-width:880px){
      #bg-canvas, #strokes-canvas{width:92%}
      .gallery-item{min-width:160px}
    }
  </style>
</head>
<body>
  <div id="app">
    <header class="header">
      <h1>初詣 ずずノ神社</h1>
      <p class="subtitle"></p>
    </header>

    <main>
      <section id="home" class="screen active">
        <div class="buttons">
          <button id="btn-draw" class="big">絵馬を描く</button>
          <button id="btn-gallery" class="big">今年の絵馬を見る</button>
          <button id="btn-omikuji" class="big">おみくじを引く</button>
        </div>
      </section>

      <section id="draw" class="screen">
        <div class="topbar">
          <label style="flex:1">注意文 <input id="notice-input" type="text" placeholder="見られても良いものを描いてください" style="width:100%;padding:6px;margin-left:8px"/></label>
          <div class="tool-controls">
            <button id="tool-pen" class="tool active">ペン</button>
            <button id="tool-eraser" class="tool">消しゴム</button>
            <label style="display:flex;align-items:center;gap:6px">太さ <input id="size-range" type="range" min="1" max="40" value="6" /></label>
            <button id="clear-canvas" class="tool">クリア</button>
          </div>
        </div>

        <div class="canvas-wrap" id="canvas-wrap" style="height:520px; max-width:820px; margin:0 auto;">
          <!-- 背景キャンバス -->
          <canvas id="bg-canvas" class="ema-layer"></canvas>
          <!-- 描画用キャンバス（上） -->
          <canvas id="strokes-canvas" class="ema-layer"></canvas>
        </div>

        <div class="actions">
          <button id="save-ema" class="primary">保存</button>
          <button id="back-from-draw" class="secondary">ホームへ</button>
        </div>
      </section>

      <section id="gallery" class="screen">
        <h2>みんなの絵馬</h2>
        <div id="gallery-row" class="gallery-row"></div>
        <div class="actions">
          <button id="back-from-gallery" class="secondary">ホームへ</button>
        </div>
      </section>

      <section id="omikuji" class="screen">
        <h2>おみくじ</h2>
        <div id="omikuji-area" class="omikuji-area">
          <video id="omikuji-video" controls playsinline style="max-width:90%; display:none;"></video>
          <img id="omikuji-result" alt="おみくじ結果" style="max-width:80%; display:none;" />
        </div>
        <div class="actions">
          <button id="play-omikuji" class="primary">おみくじを再生</button>
          <button id="back-from-omikuji" class="secondary">ホームへ</button>
        </div>
      </section>

    </main>

    <footer class="footer">
      <small>神社風デザイン — 描画はベクタ（数値）で保存します。Storage / CORS を使いません。</small>
    </footer>

    <div id="admin-open-btn" class="admin-open-btn">管理</div>
    <div id="admin-badge" class="admin-badge">Admin</div>

    <div id="admin-modal" style="display:none" class="admin-modal" aria-hidden="true">
      <div class="admin-box">
        <div id="admin-modal-content">
          <div id="admin-not-logged">
            <div style="font-weight:bold">管理者ログイン</div>
            <div style="margin-top:8px;font-size:13px;color:#666">パスワードを入力してください</div>
            <input id="admin-pass" type="password" placeholder="パスワード" />
            <div style="display:flex;gap:8px;justify-content:flex-end">
              <button id="admin-cancel" class="secondary">閉じる</button>
              <button id="admin-login" class="primary">ログイン</button>
            </div>
          </div>
          <div id="admin-logged" style="display:none">
            <div style="font-weight:bold">管理者: ログイン中</div>
            <div style="margin-top:8px;font-size:13px;color:#666">このブラウザでは常時管理者として操作できます。</div>
            <div style="margin-top:12px; display:flex; gap:8px; justify-content:flex-end">
              <button id="admin-logout" class="secondary">ログアウト</button>
              <button id="admin-close" class="primary">閉じる</button>
            </div>
          </div>
        </div>
      </div>
    </div>

  </div>

  <script type="module">
    /* =========================================================
       ベクタ方式：描画（黒ペン＆消しゴム）のデータを
       Firestore に数値（正規化された座標）で保存します。
       Storage / CORS を使わない仕様です。
       ========================================================= */

    // Firebase v12 modular
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
    import {
      getFirestore,
      collection,
      addDoc,
      query,
      orderBy,
      getDocs,
      onSnapshot,
      serverTimestamp,
      doc,
      deleteDoc
    } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

    // ------------- 設定（あなたの Firebase 設定に置き換えてください） -------------
    const CONFIG = {
      firebaseConfig: {
        apiKey: "AIzaSyDnkGy9oon2bHsp5dHDR0UozhSZdV0mDnw",
        authDomain: "zuzunojinnja.firebaseapp.com",
        projectId: "zuzunojinnja",
        // storageBucket は今回は不要（Storage を使わない実装）
        storageBucket: "zuzunojinnja.appspot.com",
        messagingSenderId: "1064706171598",
        appId: "1:1064706171598:web:04b302be4b50daf551a69f",
        measurementId: "G-6V3Z0R03VY"
      },

      // 絵馬背景画像（raw.githubusercontent 等にアップロードした画像URL）
      emaBackgroundUrl: "https://raw.githubusercontent.com/zzcafe-280/zznojinnja/main/ema.png",

      // おみくじのメディアと結果画像（任意）
      omikujiMediaUrl: "https://raw.githubusercontent.com/zzcafe-280/zznojinnja/main/omikuji.mp4",
      omikujiResultImages: [
        "https://raw.githubusercontent.com/zzcafe-280/zznojinnja/main/daikichi1.png",
        "https://raw.githubusercontent.com/zzcafe-280/zznojinnja/main/daikichi2.png",
        "https://raw.githubusercontent.com/zzcafe-280/zznojinnja/main/daikichi3.png",
        "https://raw.githubusercontent.com/zzcafe-280/zznojinnja/main/suekichi1.png",
        "https://raw.githubusercontent.com/zzcafe-280/zznojinnja/main/suekichi2.png",
        "https://raw.githubusercontent.com/zzcafe-280/zznojinnja/main/suekichi3.png",
        "https://raw.githubusercontent.com/zzcafe-280/zznojinnja/main/tyukichi1.png",
        "https://raw.githubusercontent.com/zzcafe-280/zznojinnja/main/tyukichi2.png",
        "https://raw.githubusercontent.com/zzcafe-280/zznojinnja/main/tyukichi3.png",
        "https://raw.githubusercontent.com/zzcafe-280/zznojinnja/main/kichi1.png",
        "https://raw.githubusercontent.com/zzcafe-280/zznojinnja/main/kichi2.png",
        "https://raw.githubusercontent.com/zzcafe-280/zznojinnja/main/kichi3.png",
        "https://raw.githubusercontent.com/zzcafe-280/zznojinnja/main/syoukichi1.png",
        "https://raw.githubusercontent.com/zzcafe-280/zznojinnja/main/syoukichi2.png",
        "https://raw.githubusercontent.com/zzcafe-280/zznojinnja/main/syoukichi3.png",
        "https://raw.githubusercontent.com/zzcafe-280/zznojinnja/main/kyou1.png",
        "https://raw.githubusercontent.com/zzcafe-280/zznojinnja/main/kyou2.png",
        "https://raw.githubusercontent.com/zzcafe-280/zznojinnja/main/kyou3.png"
      ],

      clickSoundUrl: "https://raw.githubusercontent.com/zzcafe-280/zznojinnja/main/click.mp3"
    };
    // ------------- /設定 ----------------------------------------------------------------

    // Firebase 初期化
    const app = initializeApp(CONFIG.firebaseConfig);
    const db = getFirestore(app);

    // DOM helpers
    const qs = s => document.querySelector(s);
    const qsa = s => document.querySelectorAll(s);

    // elements
    const btnDraw = qs('#btn-draw');
    const btnGallery = qs('#btn-gallery');
    const btnOmikuji = qs('#btn-omikuji');
    const backFromDraw = qs('#back-from-draw');
    const backFromGallery = qs('#back-from-gallery');
    const backFromOmikuji = qs('#back-from-omikuji');

    const noticeInput = qs('#notice-input');
    const toolPen = qs('#tool-pen');
    const toolEraser = qs('#tool-eraser');
    const sizeRange = qs('#size-range');
    const clearBtn = qs('#clear-canvas');
    const saveBtn = qs('#save-ema');

    const bgCanvas = qs('#bg-canvas');
    const strokesCanvas = qs('#strokes-canvas');
    const canvasWrap = qs('#canvas-wrap');

    const galleryRow = qs('#gallery-row');

    const playOmikujiBtn = qs('#play-omikuji');
    const omikujiVideo = qs('#omikuji-video');
    const omikujiResult = qs('#omikuji-result');

    const clickAudio = CONFIG.clickSoundUrl ? new Audio(CONFIG.clickSoundUrl) : null;

    // admin
    const ADMIN_KEY = 'ema_isAdmin_v1';
    const adminOpenBtn = qs('#admin-open-btn');
    const adminModal = qs('#admin-modal');
    const adminCancel = qs('#admin-cancel');
    const adminLoginBtn = qs('#admin-login');
    const adminPass = qs('#admin-pass');
    const adminLogged = qs('#admin-logged');
    const adminNotLogged = qs('#admin-not-logged');
    const adminLogout = qs('#admin-logout');
    const adminClose = qs('#admin-close');
    const adminBadge = qs('#admin-badge');
    function isAdminUser(){ return localStorage.getItem(ADMIN_KEY) === '1'; }

    // canvas contexts
    const bgCtx = bgCanvas.getContext('2d');
    const sCtx = strokesCanvas.getContext('2d');

    // logical canvas size (保存時の基準サイズ) - fixed to keep normalized coordinates consistent
    const LOGICAL_W = 1640;
    const LOGICAL_H = 1040;

    function resizeLayerCanvases(){
      // set logical size
      bgCanvas.width = LOGICAL_W; bgCanvas.height = LOGICAL_H;
      strokesCanvas.width = LOGICAL_W; strokesCanvas.height = LOGICAL_H;
      // size CSS to fit wrapper
      const maxWidth = Math.min(window.innerWidth - 40, 820);
      const cssH = (LOGICAL_H / LOGICAL_W) * maxWidth;
      bgCanvas.style.width = `${maxWidth}px`;
      bgCanvas.style.height = `${cssH}px`;
      strokesCanvas.style.width = `${maxWidth}px`;
      strokesCanvas.style.height = `${cssH}px`;
      // position canvases to fill wrap
      bgCanvas.style.left = bgCanvas.style.top = '0';
      strokesCanvas.style.left = strokesCanvas.style.top = '0';
    }
    resizeLayerCanvases();
    window.addEventListener('resize', resizeLayerCanvases);

    // load background image
    const emaImage = new Image();
    emaImage.crossOrigin = "anonymous";
    emaImage.src = CONFIG.emaBackgroundUrl;
    emaImage.onload = () => {
      drawBackground();
      redrawStrokes(); // nothing initially
    };
    function drawBackground(){
      // draw scaled to fit logical canvas (we assume emaImage sized to aspect or stretch to fit)
      bgCtx.clearRect(0,0,LOGICAL_W,LOGICAL_H);
      bgCtx.drawImage(emaImage, 0, 0, LOGICAL_W, LOGICAL_H);
      // if notice exists, draw small text near top center on background layer
      const notice = noticeInput.value || '';
      if (notice){
        bgCtx.save();
        bgCtx.fillStyle = "rgba(0,0,0,0.92)";
        const fontSize = Math.floor(LOGICAL_W / 28);
        bgCtx.font = `bold ${fontSize}px "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif`;
        bgCtx.textAlign = "center";
        bgCtx.fillText(notice, LOGICAL_W/2, fontSize + 14);
        bgCtx.restore();
      }
    }
    noticeInput.addEventListener('input', drawBackground);

    // strokes data (array of stroke objects) - accumulated during drawing before save
    // stroke: { type: 'pen'|'eraser', color:'#000', widthNorm:  (0..1 relative to LOGICAL_W), points: [{x:0..1, y:0..1}, ...] }
    let strokes = [];

    // drawing state
    let drawing = false;
    let currentStroke = null;
    let tool = 'pen';
    let penSize = parseInt(sizeRange.value,10) || 6;

    // pointer handling on top canvas; capture normalized points (0..1)
    function getPointerInLogical(e){
      const rect = strokesCanvas.getBoundingClientRect();
      const clientX = (e.clientX !== undefined) ? e.clientX : (e.touches && e.touches[0].clientX);
      const clientY = (e.clientY !== undefined) ? e.clientY : (e.touches && e.touches[0].clientY);
      // compute coordinate relative to canvas display size then map to logical
      const xRatio = (clientX - rect.left) / rect.width;
      const yRatio = (clientY - rect.top) / rect.height;
      // clamp
      const x = Math.max(0, Math.min(1, xRatio));
      const y = Math.max(0, Math.min(1, yRatio));
      return { x, y, lx: x * LOGICAL_W, ly: y * LOGICAL_H };
    }

    function beginStroke(e){
      drawing = true;
      const p = getPointerInLogical(e);
      const widthNorm = penSize / LOGICAL_W; // normalized
      currentStroke = {
        type: tool === 'eraser' ? 'eraser' : 'pen',
        color: '#000',
        widthNorm,
        points: [{x: p.x, y: p.y}]
      };
    }
    function moveStroke(e){
      if (!drawing || !currentStroke) return;
      const p = getPointerInLogical(e);
      // sample (append)
      currentStroke.points.push({x: p.x, y: p.y});
      // re-render strokes layer for immediate feedback
      redrawStrokes();
    }
    function endStroke(e){
      if (!drawing) return;
      drawing = false;
      if (currentStroke && currentStroke.points.length > 0){
        strokes.push(currentStroke);
      }
      currentStroke = null;
      redrawStrokes();
    }

    strokesCanvas.addEventListener('pointerdown', (e)=>{ strokesCanvas.setPointerCapture(e.pointerId); beginStroke(e); });
    strokesCanvas.addEventListener('pointermove', moveStroke);
    strokesCanvas.addEventListener('pointerup', (e)=>{ strokesCanvas.releasePointerCapture(e.pointerId); endStroke(e); });
    strokesCanvas.addEventListener('pointerout', endStroke);
    strokesCanvas.addEventListener('pointercancel', endStroke);

    // tool buttons
    toolPen.addEventListener('click', ()=>{
      tool = 'pen'; toolPen.classList.add('active'); toolEraser.classList.remove('active');
    });
    toolEraser.addEventListener('click', ()=>{
      tool = 'eraser'; toolEraser.classList.add('active'); toolPen.classList.remove('active');
    });
    sizeRange.addEventListener('input', (e)=>{ penSize = parseInt(e.target.value,10); });

    clearBtn.addEventListener('click', ()=>{
      if (!confirm('キャンバス上の描画をすべて消しますか？（背景は残る）')) return;
      strokes = [];
      redrawStrokes();
    });

    // redraw strokes layer: clear strokes canvas, draw strokes in order.
    function redrawStrokes(){
      // clear stroke canvas
      sCtx.clearRect(0,0,LOGICAL_W,LOGICAL_H);
      // draw all saved strokes
      for (const st of strokes.concat(currentStroke ? [currentStroke] : [])){
        if (!st) continue;
        if (st.type === 'pen'){
          sCtx.globalCompositeOperation = 'source-over';
          sCtx.strokeStyle = st.color || '#000';
        } else if (st.type === 'eraser'){
          // erase only on stroke layer: destination-out removes stroke-layer pixels
          sCtx.globalCompositeOperation = 'destination-out';
          sCtx.strokeStyle = 'rgba(0,0,0,1)'; // color ignored for destination-out
        }
        sCtx.lineWidth = (st.widthNorm || 0.004) * LOGICAL_W;
        sCtx.lineJoin = 'round';
        sCtx.lineCap = 'round';
        sCtx.beginPath();
        for (let i=0;i<st.points.length;i++){
          const p = st.points[i];
          const x = p.x * LOGICAL_W;
          const y = p.y * LOGICAL_H;
          if (i===0) sCtx.moveTo(x,y);
          else sCtx.lineTo(x,y);
        }
        sCtx.stroke();
      }
      // reset composite
      sCtx.globalCompositeOperation = 'source-over';
    }

    // When saving to Firestore, we store strokes (normalized coordinates) + notice + createdAt
    saveBtn.addEventListener('click', async ()=>{
      if (clickAudio) clickAudio.play().catch(()=>{});
      if (strokes.length === 0){
        if (!confirm('何も描画されていません。保存してもよいですか？')) return;
      }
      saveBtn.disabled = true;
      saveBtn.textContent = '保存中...';

      try {
        // prepare payload - small compression: round floats to 4 decimals to reduce size
        const compressPoints = pts => pts.map(p => ({ x: Math.round(p.x*10000)/10000, y: Math.round(p.y*10000)/10000 }));
        const payload = {
          strokes: strokes.map(s => ({
            type: s.type,
            color: s.color,
            widthNorm: Math.round((s.widthNorm || 0.004) * 100000) / 100000,
            points: compressPoints(s.points)
          })),
          notice: (noticeInput.value || '').slice(0,200),
          createdAt: serverTimestamp()
        };
        await addDoc(collection(db, 'emas'), payload);
        alert('保存しました！ホームに戻ります。');
        // clear local strokes for new drawing
        strokes = [];
        redrawStrokes();
        showScreen('home');
      } catch (err){
        console.error('save error', err);
        alert('保存に失敗しました（コンソール参照）。Firestore の権限設定をご確認ください。');
      } finally {
        saveBtn.disabled = false;
        saveBtn.textContent = '保存';
      }
    });

    // ========== Gallery: render each document by replaying strokes on background ==========
    async function fetchGalleryOnce(){
      try {
        const q = query(collection(db, 'emas'), orderBy('createdAt','desc'));
        const snap = await getDocs(q);
        const items = [];
        snap.forEach(d => items.push({ id: d.id, ...d.data() }));
        renderGallery(items);
      } catch (err){
        console.error('fetchGalleryOnce', err);
        alert('ギャラリー取得エラー。Firestore の rules を確認してください。');
      }
    }

    // create a thumbnail canvas element for each item by replaying background + strokes
    function renderGallery(items){
      galleryRow.innerHTML = '';
      items.forEach(item => {
        const wrap = document.createElement('div');
        wrap.className = 'gallery-item';
        // create a small canvas for thumbnail (keep logical drawing but show responsive)
        const thumbCanvas = document.createElement('canvas');
        const TH_W = 640; // logical thumbnail width for rendering strokes (quality)
        const TH_H = Math.round((LOGICAL_H / LOGICAL_W) * TH_W);
        thumbCanvas.width = TH_W; thumbCanvas.height = TH_H;
        const tctx = thumbCanvas.getContext('2d');
        // draw background scaled
        if (emaImage.complete){
          try { tctx.drawImage(emaImage, 0, 0, TH_W, TH_H); } catch(e){ tctx.fillStyle = '#fff'; tctx.fillRect(0,0,TH_W,TH_H); }
        } else {
          tctx.fillStyle = '#fff'; tctx.fillRect(0,0,TH_W,TH_H);
        }
        // draw notice (if stored) on background
        if (item.notice){
          tctx.save();
          tctx.fillStyle = "rgba(0,0,0,0.9)";
          const fontSize = Math.floor(TH_W / 28);
          tctx.font = `bold ${fontSize}px sans-serif`;
          tctx.textAlign = "center";
          tctx.fillText(item.notice, TH_W/2, fontSize + 12);
          tctx.restore();
        }
        // draw strokes by replaying their normalized points scaled to TH_W/TH_H
        if (item.strokes && Array.isArray(item.strokes)){
          for (const st of item.strokes){
            if (st.type === 'pen') tctx.globalCompositeOperation = 'source-over';
            else tctx.globalCompositeOperation = 'destination-out';
            tctx.strokeStyle = st.color || '#000';
            tctx.lineWidth = (st.widthNorm || 0.004) * TH_W;
            tctx.lineCap = 'round';
            tctx.lineJoin = 'round';
            tctx.beginPath();
            for (let i=0;i<st.points.length;i++){
              const p = st.points[i];
              const x = p.x * TH_W;
              const y = p.y * TH_H;
              if (i===0) tctx.moveTo(x,y);
              else tctx.lineTo(x,y);
            }
            tctx.stroke();
          }
          tctx.globalCompositeOperation = 'source-over';
        }
        // append canvas and meta
        wrap.appendChild(thumbCanvas);
        const meta = document.createElement('div');
        meta.className = 'meta';
        const time = document.createElement('small');
        if (item.createdAt && item.createdAt.seconds) time.textContent = new Date(item.createdAt.seconds*1000).toLocaleString();
        meta.appendChild(time);

        // admin delete button
        if (isAdminUser()){
          const del = document.createElement('button');
          del.textContent = '削除';
          del.onclick = async ()=>{
            if (!confirm('本当に削除しますか？')) return;
            try {
              await deleteDoc(doc(db, 'emas', item.id));
              alert('削除しました');
              // re-fetch
              fetchGalleryOnce();
            } catch(e){
              console.error('delete failed', e);
              alert('削除に失敗しました');
            }
          };
          meta.appendChild(del);
        }

        wrap.appendChild(meta);
        galleryRow.appendChild(wrap);
      });
    }

    qs('#btn-gallery').addEventListener('click', ()=>{
      fetchGalleryOnce();
      // set live listener (optional)
      if (window._galleryUnsub) window._galleryUnsub();
      const q = query(collection(db, 'emas'), orderBy('createdAt','desc'));
      window._galleryUnsub = onSnapshot(q, snap => {
        const items = [];
        snap.forEach(d => items.push({ id: d.id, ...d.data() }));
        renderGallery(items);
      }, err => {
        console.error('onSnapshot gallery error', err);
      });
    });
    backFromGallery.addEventListener('click', ()=>{
      if (window._galleryUnsub){ window._galleryUnsub(); window._galleryUnsub = null; }
      showScreen('home');
    });

    // ========== Omikuji (unchanged simple behavior) ==========
    omikujiVideo.src = CONFIG.omikujiMediaUrl;
    omikujiVideo.crossOrigin = 'anonymous';
    playOmikujiBtn.addEventListener('click', ()=>{
      if (clickAudio) clickAudio.play().catch(()=>{});
      omikujiResult.style.display = 'none';
      omikujiVideo.style.display = 'block';
      omikujiVideo.currentTime = 0;
      omikujiVideo.play().catch(()=>{});
      const onEnd = ()=>{
        omikujiVideo.style.display = 'none';
        const arr = CONFIG.omikujiResultImages;
        if (!arr || arr.length === 0){
          alert('おみくじ画像が設定されていません。CONFIG.omikujiResultImages を編集してください。');
          return;
        }
        const pick = arr[Math.floor(Math.random() * arr.length)];
        omikujiResult.src = pick;
        omikujiResult.style.display = 'block';
        omikujiVideo.removeEventListener('ended', onEnd);
      };
      omikujiVideo.addEventListener('ended', onEnd);
    });

    // navigation (always available)
    function showScreen(id){
      qsa('.screen').forEach(s => s.classList.remove('active'));
      qs('#' + id).classList.add('active');
      window.scrollTo({top:0, behavior:'smooth'});
    }
    btnDraw.addEventListener('click', ()=> showScreen('draw'));
    btnOmikuji.addEventListener('click', ()=> showScreen('omikuji'));
    backFromDraw.addEventListener('click', ()=> showScreen('home'));
    backFromOmikuji.addEventListener('click', ()=> showScreen('home'));

    // ========== Admin UI (simple local password 1122) ==========
    function updateAdminUI(){
      if (isAdminUser()){
        adminBadge.classList.add('visible');
        adminNotLogged.style.display = 'none';
        adminLogged.style.display = 'block';
      } else {
        adminBadge.classList.remove('visible');
        adminNotLogged.style.display = 'block';
        adminLogged.style.display = 'none';
      }
    }
    adminOpenBtn.addEventListener('click', ()=>{
      adminModal.style.display = 'flex';
      adminModal.setAttribute('aria-hidden','false');
      updateAdminUI();
    });
    adminCancel.addEventListener('click', ()=>{
      adminModal.style.display = 'none';
      adminModal.setAttribute('aria-hidden','true');
      adminPass.value = '';
    });
    adminLoginBtn.addEventListener('click', ()=>{
      const pass = adminPass.value || '';
      if (pass === '1122'){
        localStorage.setItem(ADMIN_KEY, '1');
        alert('管理者ログインしました（このブラウザで常時有効）');
        adminPass.value = '';
        updateAdminUI();
      } else {
        alert('パスワードが違います');
      }
    });
    adminLogout.addEventListener('click', ()=>{
      if (!confirm('ログアウトしますか？')) return;
      localStorage.removeItem(ADMIN_KEY);
      alert('ログアウトしました');
      updateAdminUI();
    });
    adminClose.addEventListener('click', ()=>{
      adminModal.style.display = 'none';
      adminModal.setAttribute('aria-hidden','true');
    });
    adminModal.addEventListener('click', (e)=>{
      if (e.target === adminModal){
        adminModal.style.display = 'none';
        adminModal.setAttribute('aria-hidden','true');
      }
    });

    // ========== 初期化 ==========
    function init(){
      drawBackground();
      redrawStrokes();
      updateAdminUI();
    }
    init();

    // expose for debug
    window._EMA_APP = { CONFIG, db, redrawStrokes, strokes, isAdminUser };

  </script>
</body>
</html>
